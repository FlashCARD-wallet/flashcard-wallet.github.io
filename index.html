<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invito Gruppo Famiglia | FlashCARD</title>

    <meta
        name="description"
        content="Apri un invito al Gruppo Famiglia nell'app FlashCARD."
    >

    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f4f6f8;
            color: #17202a;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 32px 24px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .brand {
            margin: 0 0 8px;
            color: #1565c0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        h1 {
            margin: 22px 0 12px;
            font-size: 24px;
        }

        .description {
            margin: 0 auto 22px;
            color: #52606d;
            font-size: 16px;
            line-height: 1.5;
        }

        .code-label {
            margin-bottom: 8px;
            color: #52606d;
            font-size: 14px;
        }

        .invite-code {
            margin: 0 0 22px;
            padding: 16px;
            border: 2px dashed #1565c0;
            border-radius: 12px;
            background: #eef5ff;
            color: #0d47a1;
            font-family: monospace;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 1px;
            word-break: break-word;
        }

        .button {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 15px 18px;
            border: 0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .primary {
            background: #1565c0;
            color: #ffffff;
        }

        .secondary {
            background: #e9eef4;
            color: #17202a;
        }

        .button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .status {
            min-height: 24px;
            margin-top: 18px;
            color: #52606d;
            font-size: 14px;
            line-height: 1.4;
        }

        .warning {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            color: #52606d;
            font-size: 14px;
            line-height: 1.5;
        }

        .invalid {
            color: #b3261e;
        }
    </style>
</head>

<body>
    <main class="card">
        <p class="brand">FlashCARD</p>

        <h1>Invito Gruppo Famiglia</h1>

        <p class="description">
            Apri FlashCARD per inviare la richiesta di partecipazione
            al Gruppo Famiglia.
        </p>

        <p class="code-label">Codice Gruppo Famiglia</p>

        <div id="inviteCode" class="invite-code">
            Codice non disponibile
        </div>

        <button
            id="openAppButton"
            class="button primary"
            type="button"
            disabled
        >
            Apri FlashCARD
        </button>

        <button
            id="copyButton"
            class="button secondary"
            type="button"
            disabled
        >
            Copia codice
        </button>

        <p id="statusMessage" class="status"></p>

        <p class="warning">
            Se FlashCARD non si apre, copia il codice e inseriscilo
            manualmente nella sezione Gruppo Famiglia dell'app.
        </p>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const rawCode = params.get("code") || "";

        const normalizedCode = rawCode
            .trim()
            .toUpperCase();

        const validCodePattern = /^FAM-[A-Z0-9]{6,8}$/;
        const isValidCode = validCodePattern.test(normalizedCode);

        const inviteCodeElement =
            document.getElementById("inviteCode");

        const openAppButton =
            document.getElementById("openAppButton");

        const copyButton =
            document.getElementById("copyButton");

        const statusMessage =
            document.getElementById
("statusMessage");

        if (isValidCode) {
            inviteCodeElement.textContent = normalizedCode;
            openAppButton.disabled = false;
            copyButton.disabled = false;
        } else {
            inviteCodeElement.textContent =
                "Codice invito non valido";

            inviteCodeElement.classList.add("invalid");

            statusMessage.textContent =
                "Apri nuovamente il collegamento ricevuto oppure inserisci il codice manualmente nell'app.";
        }

        openAppButton.addEventListener("click", function () {
            if (!isValidCode) {
                return;
            }

            const appUrl =
                "flashcard://family/join?code=" +
                encodeURIComponent(normalizedCode);

            statusMessage.textContent =
                "Apertura di FlashCARD in corso...";

            window.location.href = appUrl;
        });

        copyButton.addEventListener("click", async function () {
            if (!isValidCode) {
                return;
            }

            try {
                await navigator.clipboard.writeText(normalizedCode);

                statusMessage.textContent =
                    "Codice copiato. Ora puoi incollarlo in FlashCARD.";
            } catch (error) {
                statusMessage.textContent =
                    "Non è stato possibile copiare automaticamente il codice. Tieni premuto sul codice per copiarlo.";
            }
        });
    </script>
</body>
</html>
